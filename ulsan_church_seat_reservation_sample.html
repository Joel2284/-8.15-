<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>울산교회 행사 좌석 예약</title>
<style>
body{font-family:sans-serif;max-width:1200px;margin:20px auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(20,40px);gap:6px}
.seat{width:40px;height:40px;border:1px solid #999;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px}
.selected{background:#4caf50;color:#fff}
.stage{background:#eee;padding:15px;text-align:center;margin-bottom:20px;font-weight:bold}
</style>
</head>
<body>
<h1>울산교회 행사 좌석 예약 (샘플)</h1>
<div class="stage">무대</div>
<p>좌석을 클릭해 선택하세요.</p>
<div id="seats" class="grid"></div>
<p><strong>선택 좌석:</strong> <span id="selected">없음</span></p>

<script>
const container=document.getElementById('seats');
const selected=document.getElementById('selected');
let current=null;

for(let r=0;r<50;r++){
  for(let c=1;c<=20;c++){
    const d=document.createElement('div');
    const name=String.fromCharCode(65+r)+c;
    d.className='seat';
    d.textContent=name;
    d.onclick=()=>{
      document.querySelectorAll('.seat').forEach(x=>x.classList.remove('selected'));
      d.classList.add('selected');
      current=name;
      selected.textContent=name;
    };
    container.appendChild(d);
  }
}
</script>
</body>
</html>
